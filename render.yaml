# Render blueprint: New + > Blueprint, pick this repository. Free web service built from the Dockerfile.
# Secrets marked sync:false are asked in the dashboard (database credentials of your MySQL host).
services:
  - type: web
    name: heatalert
    runtime: docker
    plan: free
    healthCheckPath: /
    envVars:
      - { key: APP_ENV, value: production }
      - { key: APP_DEBUG, value: "false" }
      - { key: APP_URL, sync: false }
      - { key: DB_CONNECTION, value: mysql }
      - { key: DB_HOST, sync: false }
      - { key: DB_PORT, value: "4000" }
      - { key: DB_DATABASE, sync: false }
      - { key: DB_USERNAME, sync: false }
      - { key: DB_PASSWORD, sync: false }
      - { key: MYSQL_ATTR_SSL_CA, value: /etc/ssl/certs/ca-certificates.crt }
      - { key: SESSION_DRIVER, value: database }
      - { key: QUEUE_CONNECTION, value: database }
      - { key: CACHE_STORE, value: database }
      - { key: MAIL_MAILER, value: log }
      - { key: GEMINI_API_KEY, sync: false }
